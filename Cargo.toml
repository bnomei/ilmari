[package]
name = "ilmari"
version = "0.8.0"
edition = "2021"
license = "MIT"
rust-version = "1.88.0"
description = "Minimal tmux popup radar for coding agents"
readme = "README.md"
homepage = "https://github.com/bnomei/ilmari"
repository = "https://github.com/bnomei/ilmari"
documentation = "https://docs.rs/ilmari"
keywords = ["tmux", "tui", "cli", "developer-tools", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".DS_Store", "docs/**", "loops/**", "specs/**"]

[features]
default = ["tui", "socket", "mcp"]
tui = ["dep:crossterm", "dep:ratatui"]
socket = []
mcp = ["dep:axum", "dep:rmcp", "dep:tokio", "dep:tokio-util"]
rmcp = ["mcp"]

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.0", optional = true }
regex = "1.12.3"
rmcp = { version = "1.7.0", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"], optional = true }
tokio-util = { version = "0.7", optional = true }
toml = "0.9.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"
