[package]
name = "ilmari"
version = "0.9.5"
edition = "2021"
license = "MIT"
rust-version = "1.88.0"
description = "Minimal tmux popup radar for coding agents"
readme = "README.md"
homepage = "https://github.com/bnomei/ilmari"
repository = "https://github.com/bnomei/ilmari"
documentation = "https://docs.rs/ilmari"
keywords = ["tmux", "tui", "cli", "developer-tools", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".DS_Store", "docs/**", "loops/**", "specs/**"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ilmari-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# Linux release assets are fully static musl binaries. cargo-binstall reports
# the conventional GNU target on most Linux hosts, so map it to that asset.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ilmari-v{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ilmari-v{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[features]
default = ["tui", "socket", "mcp"]
tui = ["dep:crossterm", "dep:ratatui"]
socket = []
mcp = ["dep:axum", "dep:rmcp", "dep:tokio", "dep:tokio-util"]
# Compatibility alias: older tooling enabled MCP via `--features rmcp`.
rmcp = ["mcp"]

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.0", optional = true }
regex = "1.12.3"
rmcp = { version = "1.7.0", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"], optional = true }
tokio-util = { version = "0.7", optional = true }
toml = "0.9.12"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"
